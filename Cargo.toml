# Workspace do Cargo: reúne todos os crates Rust do projeto num só build,
# compartilhando o diretório target/ e o Cargo.lock da raiz.
[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "packages/infra-sqlite", "packages/sync", "packages/lan", "modules/notes/rust", "modules/focus/rust"]

# Perfis de compilação só valem na raiz do workspace.
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package]
name = "desktop"
version = "0.6.1"
description = "Tramion: aplicativo desktop local-first de organização pessoal"
authors = ["Tramion"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tramion-infra-sqlite = { version = "0.1.0", path = "../../../packages/infra-sqlite" }
tramion-notes = { version = "0.1.0", path = "../../../modules/notes/rust" }
tramion-focus = { version = "0.1.0", path = "../../../modules/focus/rust" }
tauri-plugin-notification = "2"

# Só no computador: bandeja do sistema e instância única não existem no celular.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[package]
name = "tramion-focus"
version = "0.1.0"
description = "Módulo Foco (pomodoro e hábitos): migrações, lógica e comandos (plugin do Tauri)"
edition = "2024"
publish = false
# O Tauri usa `links` para o app descobrir as permissões deste plugin.
links = "tauri-plugin-focus"

[dependencies]
tramion-infra-sqlite = { version = "0.1.0", path = "../../../packages/infra-sqlite" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[package]
name = "tramion-notes"
version = "0.1.0"
description = "Módulo de notas: migrações, lógica e comandos (plugin do Tauri)"
edition = "2024"
publish = false
# O Tauri usa `links` para o app descobrir as permissões deste plugin.
links = "tauri-plugin-notes"

[dependencies]
tramion-infra-sqlite = { version = "0.1.0", path = "../../../packages/infra-sqlite" }
tramion-sync = { version = "0.1.0", path = "../../../packages/sync" }
open = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tempfile = "3.27.0"
